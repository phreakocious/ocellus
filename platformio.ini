[platformio]
src_dir = .

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test/> -<tools/>  ; src_dir=. would otherwise sweep test/ and tools/ (each has main()) into the firmware
board_build.partitions = partitions/ocellus_4mb.csv
board_build.filesystem = littlefs

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino @ 1.3.7
    mathertel/OneButton @ ^2.0.3
    bblanchon/ArduinoJson @ ^7.0.0

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1   ; ESP32-S3-WROOM-1 (S3R2, 2MB PSRAM, native USB-Serial/JTAG)
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test/> -<tools/>
board_build.partitions = partitions/ocellus_8mb.csv
board_build.filesystem = littlefs

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino @ 1.3.7
    mathertel/OneButton @ ^2.0.3
    bblanchon/ArduinoJson @ ^7.0.0

[env:esp32-s3-touch-128]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test/> -<tools/>
board_build.flash_size = 16MB
board_upload.flash_size = 16MB    ; must mirror board_build: this is what esptool stamps into the bootloader header. Without it the header stays at the devkitc-1 default (8MB) and the bootloader rejects ocellus_16mb.csv's >8MB spiffs -> silent reboot loop.
board_build.arduino.memory_type = qio_qspi   ; S3R2 = Quad-SPI PSRAM (NOT opi_*)
board_build.partitions = partitions/ocellus_16mb.csv
board_build.filesystem = littlefs

build_flags =
    -D BOARD_WAVESHARE_128
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0             ; USB-C is CH343 -> UART0, not native USB-Serial/JTAG

lib_deps =
    moononournation/GFX Library for Arduino @ 1.3.7
    mathertel/OneButton @ ^2.0.3
    bblanchon/ArduinoJson @ ^7.0.0

[env:esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitc-1   ; ESP32-S3FH4R2 -- same core; the deltas from the DevKitC are set below
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test/> -<tools/>
board_build.flash_size = 4MB          ; the devkitc-1 definition assumes 8MB; the Zero has 4
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions/ocellus_4mb.csv
board_build.filesystem = littlefs
; PSRAM deliberately NOT enabled: the 115KB canvas is forced into internal RAM (InternalCanvas) and
; nothing else wants it, so there is no memory_type to get wrong.

build_flags =
    -D BOARD_S3_ZERO
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1      ; native USB-Serial/JTAG on USB-C (no bridge chip)

lib_deps =
    moononournation/GFX Library for Arduino @ 1.3.7
    mathertel/OneButton @ ^2.0.3
    mathertel/RotaryEncoder @ ^1.5.3
    bblanchon/ArduinoJson @ ^7.0.0

; Compile-check env only: the audio-off flavor of the primary board (never flashed as-is).
; A compile-time config axis nobody builds rots silently -- keep this green alongside esp32-s3.
[env:esp32-s3-noaudio]
extends = env:esp32-s3
board_build.partitions = partitions/ocellus_8mb.csv
board_build.filesystem = littlefs
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D OCELLUS_AUDIO=0

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson @ ^7.0.0
build_src_filter = -<*> +<config.cpp> +<protocol.cpp> +<palette.cpp> +<audio.cpp> +<slide_proto.cpp> +<battery.cpp>
